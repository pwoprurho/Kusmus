{% extends "layout.html" %}
{% block content %}
    <h1>Course Catalog</h1>
    <p>Browse our available courses and start learning.</p>
    <hr>
    {% for course in courses %}
        <article>
            <h2><a href="{{ url_for('main.student_course_view', course_id=course.id) }}">{{ course.title }}</a></h2>
            <p>{{ course.description }}</p>
        </article>
        <hr>
    {% endfor %}
{% endblock content %}
