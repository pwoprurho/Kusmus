{% extends "layout.html" %}
{% block content %}
<div style="text-align: center; margin-top: 50px;">
    <h2>Completing Login...</h2>
    <p>Please wait while we set up your session.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = "{{ config['SUPABASE_URL'] or '' }}";
    const supabaseKey = "{{ config['SUPABASE_KEY'] or '' }}";

    // If we don't have config in template, we might need to hardcode or get from env somehow
    // But better to just use the hash fragment if available

    window.onload = function () {
        // Supabase-js automatically recovers the session from the URL hash
        // We just need to give it a second and then redirect.
        setTimeout(() => {
            window.location.href = "{{ url_for('main.dashboard') }}";
        }, 1500);
    };
</script>
{% endblock %}
